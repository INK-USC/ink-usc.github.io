<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARBOR trace viewer</title>
<style>
  :root {
    --ink: #1f1f1f; --ink-2: #555; --ink-3: #8a8a8a; --line: #dcdcdc; --bg: #ffffff; --panel: #fafafa;
    --rep: #2a78d6; --und: #e8731f; --uns: #7c3aed; --ok: #15803d;
    --rep-bg: #e3edfb; --und-bg: #fdeedd; --uns-bg: #ece6fb; --ok-bg: #e3f3e8;
    --node-open: #ffffff; --node-dead: #e4e4e4; --node-conf: #fcdada; --node-commit: #1f1f1f;
    --sel: #1d4ed8; --new: #15803d; --new-bg: #dcfce7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ent-house { font-weight: 700; } .ent-value { font-weight: 700; color: #1d4ed8; } .ent-name { font-weight: 700; color: #0f766e; }
  .divider { flex: none; width: 6px; cursor: col-resize; background: transparent; position: relative; z-index: 2; margin: 0 -3px; }
  .divider:hover, .divider.active { background: rgba(29,78,216,.25); }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header .title { font-weight: 600; font-size: 16px; }
  header .meta { color: var(--ink-2); }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); }
  .badge.correct { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
  .badge.incorrect { color: #d62828; border-color: #d62828; background: #fde8e8; }
  .badge.truncated { color: var(--und); border-color: var(--und); background: var(--und-bg); }
  header button, .btn { font: inherit; font-size: 13.5px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; color: var(--ink-2); }
  header button:hover, .btn:hover { border-color: var(--ink-3); color: var(--ink); }
  header .spacer { flex: 1; }
  #puzzle { display: none; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); max-height: 60vh; overflow: auto; white-space: pre-wrap; color: var(--ink-2); font-size: 12px; }
  #puzzle.show { display: block; }

  /* ---------- main ---------- */
  main { flex: 1; display: flex; min-height: 0; }
  #treePane { flex: 1; position: relative; min-width: 0; border-right: 1px solid var(--line); }
  #treePane svg { width: 100%; height: 100%; display: block; cursor: grab; }
  #treePane svg:active { cursor: grabbing; }
  #treeLegend { position: absolute; left: 10px; bottom: 8px; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 12.5px; color: var(--ink-2); display: grid; grid-template-columns: auto auto; gap: 2px 14px; }
  #treeLegend span { display: inline-flex; align-items: center; gap: 6px; }
  #treeLegend i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
  #treeLegend i.ln { width: 16px; height: 0; border-radius: 0; border: none; }
  #treeLegend b.lh { font-weight: 600; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; align-self: center; }
  #treeLegend div.lr { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; }
  #treeHint { position: absolute; right: 10px; top: 8px; font-size: 12.5px; color: var(--ink-3); }
  #treeTools { position: absolute; left: 10px; top: 8px; display: flex; gap: 6px; }

  #detailPane { flex: none; width: 0; overflow: hidden; transition: none; border-right: 1px solid var(--line); background: var(--panel); }
  #detailPane.open { width: var(--dw, 480px); }
  #detailInner { width: var(--dw, 480px); height: 100%; overflow: auto; padding: 12px 14px; }
  #detailPane h3 { margin: 0 0 6px; font-size: 15.5px; display: flex; align-items: center; gap: 8px; }
  #detailPane h3 .close { margin-left: auto; cursor: pointer; color: var(--ink-3); font-weight: 400; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .card .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); margin: 10px 0 4px; }
  .card .sec:first-child { margin-top: 0; }
  .muted { color: var(--ink-2); }
  .small { font-size: 12.5px; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--line); background: #fff; font-size: 13px; margin: 2px 3px 2px 0; white-space: nowrap; }
  .pill.new { border-color: var(--new); background: var(--new-bg); color: var(--new); font-weight: 600; }
  .pill.removed { text-decoration: line-through; color: var(--ink-3); }
  .pill.link { cursor: pointer; }
  .pill.link:hover { border-color: var(--sel); color: var(--sel); }
  .op { display: inline-block; padding: 1px 6px; border-radius: 4px; background: #eee; color: var(--ink-2); font-size: 12px; font-weight: 600; letter-spacing: .03em; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid transparent; margin: 2px 4px 2px 0; }
  .chip.rep { color: var(--rep); background: var(--rep-bg); border-color: var(--rep); }
  .chip.und { color: var(--und); background: var(--und-bg); border-color: var(--und); }
  .chip.uns { color: var(--uns); background: var(--uns-bg); border-color: var(--uns); }
  .chip.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); cursor: default; }
  .chip.active { outline: 2px solid currentColor; outline-offset: 1px; }
  .rowdetail { display: none; border-left: 3px solid var(--line); padding: 6px 10px; margin: 4px 0 8px; font-size: 14px; background: #fff; }
  .rowdetail.show { display: block; }
  .rowdetail.rep { border-color: var(--rep); } .rowdetail.und { border-color: var(--und); } .rowdetail.uns { border-color: var(--uns); }
  details { margin: 4px 0; } details summary { cursor: pointer; color: var(--ink-2); font-size: 13.5px; }
  table.grid { border-collapse: collapse; font-size: 12.5px; margin: 4px 0; width: 100%; table-layout: fixed; }
  table.grid th, table.grid td { border: 1px solid var(--line); padding: 3px 4px; text-align: left; vertical-align: top; word-break: break-word; overflow-wrap: anywhere; }
  table.grid th:first-child { width: 34px; }
  table.grid th { background: #f3f3f3; font-weight: 600; color: var(--ink-2); }
  table.grid td.empty { color: #c8c8c8; text-align: center; }
  table.grid td.own { font-weight: 700; }
  table.grid td.new { background: var(--new-bg); color: var(--new); font-weight: 700; }
  table.grid td.wrong { text-decoration: underline dotted #d62828; text-decoration-thickness: 2px; }
  table.grid td.diffb { background: var(--und-bg); }
  #puzzle table.grid { width: auto; min-width: 100%; }
  .notes { margin: 0 0 6px; padding: 8px 10px; border: 1px solid var(--und); border-radius: 6px; background: var(--und-bg); font-size: 14px; }
  .notes b { color: var(--und); }
  .t .tag .note { padding: 0 6px; border-radius: 4px; background: var(--und-bg); color: var(--und); font-size: 11.5px; font-weight: 600; }
  .status-line { padding: 6px 9px; border-radius: 6px; background: #f3f3f3; font-size: 14px; }
  .status-line.dead { background: #ececec; } .status-line.conf { background: var(--rep-bg); } .status-line.commit { background: var(--ok-bg); }
  .touch { display: inline-flex; gap: 5px; align-items: center; margin: 2px 6px 2px 0; font-size: 13px; cursor: pointer; }
  .touch b { color: var(--sel); }
  .touch:hover b { text-decoration: underline; }
  .role { padding: 0 6px; border-radius: 4px; background: #eee; color: var(--ink-2); font-size: 11.5px; }
  .role.created { background: #dbeafe; color: #1e40af; } .role.pruned { background: #ececec; color: #555; }
  .role.entered { background: #fef3c7; color: #92400e; } .role.re-opened { background: #fef3c7; color: #92400e; } .role.verified { background: #e0e7ff; color: #3730a3; } .role.committed { background: var(--ok-bg); color: var(--ok); }

  /* ---------- thoughts ---------- */
  #thoughtsPane { flex: none; width: var(--tw, 470px); display: flex; flex-direction: column; min-height: 0; }
  #thoughtsHead { padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #thoughtsHead .key { display: inline-flex; align-items: center; gap: 4px; }
  #thoughtsHead .key i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  #thoughts { flex: 1; overflow: auto; padding: 4px 0 40vh; }
  .t { display: flex; gap: 8px; padding: 3px 12px 3px 8px; border-left: 3px solid transparent; cursor: pointer; }
  .t:hover { background: #f4f4f4; }
  .t .idx { width: 42px; flex: none; color: var(--ink-3); font-variant-numeric: tabular-nums; text-align: right; font-size: 12.5px; padding-top: 3px; }
  .t .txt { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
  .t .tag { flex: none; align-self: flex-start; }
  .t.rep { background: var(--rep-bg); border-left-color: var(--rep); }
  .t.und { background: var(--und-bg); border-left-color: var(--und); }
  .t.uns { background: var(--uns-bg); border-left-color: var(--uns); }
  .t.sel { outline: 2px solid var(--sel); outline-offset: -2px; }
  #thoughts.focusmode .t { opacity: .3; }
  #thoughts.focusmode .t.rel, #thoughts.focusmode .t.sel, #thoughts.focusmode .t.ctx { opacity: 1; }
  #thoughts.focusmode .t.ctx:not(.rel):not(.sel) { opacity: .7; }
  .t.src { box-shadow: inset 0 0 0 2px var(--ink); }

  /* ---------- svg ---------- */
  .edge { stroke: #b9b9b9; stroke-width: 1.3; fill: none; }
  .edge.lin { stroke: var(--ink); stroke-width: 2.4; }
  .edge.dim { stroke: #e2e2e2; }
  .edge.k-needs { stroke-dasharray: 1.5 2.5; }
  .edge.k-attempt, .edge.k-reshape { stroke-dasharray: 5 3; }
  .edge.k-together { stroke-width: 2.8; }
  .edge.k-together.lin { stroke-width: 3.6; }
  .madeof { fill: none; stroke: #7c3aed; stroke-width: 1.2; stroke-dasharray: 3 3; opacity: .85; marker-end: url(#arrowmade); }
  .madeof-lbl { font-size: 9.5px; fill: #7c3aed; }
  .elbl { font-size: 9px; fill: #1d4ed8; display: none; } .elbl.show { display: block; }
  .node circle.body { stroke: var(--ink); stroke-width: 1.5; fill: var(--node-open); cursor: pointer; }
  .node.leaf circle.body { stroke-dasharray: 3 2; }
  .node.provisional circle.body { stroke-dasharray: 2 2; fill: #fafafa; }
  .link { fill: none; stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 2 3; marker-end: url(#arrowlink); }
  .node.closed circle.body { fill: var(--node-dead); stroke: #9a9a9a; }
  .node.contradictory circle.body { fill: var(--node-conf); stroke: var(--rep); stroke-width: 2; }
  .node.committed circle.body { fill: var(--node-commit); stroke: var(--node-commit); }
  .node.root circle.body { fill: #777; stroke: #777; }
  .node circle.ring { fill: none; stroke: var(--ink); stroke-width: 1; }
  .node.closed circle.ring { stroke: #9a9a9a; }
  .node text { font-size: 9px; fill: var(--ink-2); pointer-events: none; text-anchor: middle; }
  .node text.lbl { font-size: 11.5px; fill: var(--ink); text-anchor: start; display: none; }
  .node text.lbl tspan.h { font-weight: 700; } .node text.lbl tspan.v { font-weight: 700; fill: #1d4ed8; } .node text.lbl tspan.n { font-weight: 700; fill: #0f766e; }
  .node.dim { opacity: .22; }
  .node.lin text.lbl { display: block; }
  .node.sel circle.body { stroke: var(--sel); stroke-width: 3; }
  .node.against circle.body { stroke: var(--sel); stroke-width: 3; stroke-dasharray: 4 2; }
  .node.hot circle.body { stroke: var(--sel); stroke-width: 2.5; }
  .arc { fill: none; stroke-width: 2; stroke-dasharray: 5 3; marker-end: url(#arrow); }
  .arc.rep { stroke: var(--rep); } .arc.und { stroke: var(--und); } .arc.uns { stroke: var(--uns); }
  /* ---------- v2: story roles ---------- */
  :root { --err: #d62828; --err-bg: #fde8e8; --ori: #d97706; --ori-bg: #fef3c7; --fol: #e88a8a; --fol-bg: #fff1f1; --btw: #bdbdbd; --btw-bg: #f6f6f6; }
  #thoughts.story .t { opacity: .55; }
  #thoughts.story .t.role-between, #thoughts.story .t.role-mention { opacity: .85; }
  #thoughts.story .t.role-origin, #thoughts.story .t.role-error, #thoughts.story .t.role-follow, #thoughts.story .t.sel, #thoughts.story .t.rel { opacity: 1; }
  #thoughts.story.focusmode .t:not(.rel):not(.sel):not(.ctx):not(.role-origin):not(.role-error):not(.role-follow) { opacity: .3; }
  .t.role-between { border-left-color: var(--btw); background: var(--btw-bg); }
  .t.role-mention { border-left-color: #8a8a8a; background: #efefef; }
  .t.role-follow { border-left-color: var(--fol); background: var(--fol-bg); }
  .t.role-origin { border-left-color: var(--ori); background: var(--ori-bg); }
  .t.role-error { border-left-color: var(--err); background: var(--err-bg); box-shadow: inset 0 0 0 2px var(--err); }
  .t .rolelbl { flex: none; align-self: flex-start; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; margin-top: 3px; }
  .t.role-error .rolelbl { background: var(--err); color: #fff; } .t.role-origin .rolelbl { background: var(--ori); color: #fff; } .t.role-follow .rolelbl { background: var(--fol); color: #fff; }
  #thoughts { position: relative; }
  #marginArrow { position: absolute; left: 0; top: 0; width: 30px; pointer-events: none; overflow: visible; }
  #marginArrow path { fill: none; stroke: var(--err); stroke-width: 2; }
  .t .mlbl { font-size: 11.5px; font-weight: 600; color: var(--err); margin-bottom: 2px; }
  #marginLabel { display: none !important; position: absolute; left: 50px; pointer-events: none; font-size: 11.5px; font-weight: 600; color: var(--err); background: rgba(255,255,255,.92); border: 1px solid var(--err); border-radius: 4px; padding: 0 6px; }
  .node circle.rolering { fill: none; stroke-width: 3; }
  .node circle.rolering.role-error { stroke: var(--err); } .node circle.rolering.role-origin { stroke: var(--ori); } .node circle.rolering.role-follow { stroke: var(--fol); }
  .node.story.dim { opacity: .8; }
  .arc.story { stroke-dasharray: none; stroke-width: 2.2; }
  .arclbl { font-size: 10.5px; font-weight: 600; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
  #storyCard { border: 2px solid var(--err); border-radius: 8px; background: #fff; padding: 10px 12px; margin-bottom: 10px; }
  #storyCard .rowhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #storyCard .rowname { font-weight: 700; font-size: 16px; }
  #storyCard .defn { color: var(--ink-2); font-size: 13.5px; cursor: pointer; text-decoration: underline dotted; }
  #storyCard .defbox { display: none; margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--line); background: var(--panel); font-size: 13.5px; }
  #storyCard .defbox.show { display: block; }
  #storyCard .thought { margin: 8px 0 6px; font-style: italic; }
  #storyCard ol { margin: 4px 0 0 0; padding-left: 26px; }
  #storyCard li { margin: 5px 0; position: relative; }
  #storyCard li .clickme { font-size: 10.5px; font-weight: 700; color: var(--err); border: 1px solid var(--err); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: middle; }
  #storyCard li.done .clickme { display: none; }
  #storyCard li.done::marker { color: var(--ok); }
  .spill { display: inline-block; padding: 0 6px; border-radius: 5px; border: 1.5px solid var(--line); font-size: 13px; font-weight: 700; cursor: pointer; margin: 0 1px; white-space: nowrap; background: #fff; }
  .spill:hover { filter: brightness(.92); }
  .spill.role-error { border-color: var(--err); color: var(--err); background: var(--err-bg); } .spill.role-origin { border-color: var(--ori); color: #92400e; background: var(--ori-bg); }
  .spill.role-follow { border-color: var(--fol); color: #b91c1c; background: var(--fol-bg); } .spill.role-between, .spill.role-mention { border-color: #9a9a9a; color: var(--ink-2); background: #f2f2f2; }
  .spill.done { box-shadow: 0 0 0 2px var(--ok-bg); }
  #storyCard .evid { margin-top: 8px; } #storyCard .evid div { padding: 2px 8px; border-radius: 5px; margin: 3px 0; font-size: 13.5px; }
  #storyCard .evid .ok { background: var(--ok-bg); color: var(--ok); } #storyCard .evid .bad { background: var(--err-bg); color: var(--err); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  #storyCard .evid .neutral { background: #f3f3f3; color: var(--ink-2); }
  #storyCard .conseq { margin-top: 8px; font-size: 13.5px; } #storyCard .foot { margin-top: 8px; font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 6px; }
  #thoughtsHead .key i.r { background: var(--err-bg); border-left: 3px solid var(--err); } #thoughtsHead .key i.o { background: var(--ori-bg); border-left: 3px solid var(--ori); }
  #thoughtsHead .key i.f { background: var(--fol-bg); border-left: 3px solid var(--fol); } #thoughtsHead .key i.b { background: var(--btw-bg); border-left: 3px solid var(--btw); }
  #tourBar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(20,22,28,.94); color: #fff; padding: 14px 22px; font-size: 17px; line-height: 1.45; box-shadow: 0 -2px 12px rgba(0,0,0,.25); }
  #tourBar.show { display: flex; gap: 18px; align-items: center; }
  #tourBar .tt { font-weight: 700; font-size: 19px; margin-bottom: 3px; }
  #tourBar .tx { color: #e6e8ee; }
  #tourBar .tn { flex: none; color: #aab; font-size: 13px; }
  #tourBar button { flex: none; background: #fff; color: #111; border: 0; border-radius: 6px; padding: 8px 14px; font-size: 15px; cursor: pointer; }
  #tourBar .body { flex: 1; }
  body.touring main { margin-bottom: 92px; }

  /* ---------- v3: progressive disclosure ---------- */
  :root { --guide: #1e293b; --guide-ink: #ffffff; --cons: #334155; }
  #guide { border: 2px solid var(--err); border-radius: 8px; background: #fff; padding: 10px 12px; margin-bottom: 10px; }
  #guide .rowhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #guide .rowname { font-weight: 700; font-size: 16px; }
  #guide .defn { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }
  #guide .say { margin: 8px 0 0; padding-left: 0; list-style: none; }
  #guide .say li { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; font-size: 14.5px; line-height: 1.45; color: var(--ink-2); }
  #guide .say li.now { color: var(--ink); font-weight: 500; }
  #guide .say li i.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: #cfcfcf; }
  #guide .say li.r-error i.dot { background: var(--err); } #guide .say li.r-origin i.dot { background: var(--ori); } #guide .say li.r-between i.dot { background: var(--btw); }
  #guide .say li.r-follow i.dot { background: var(--fol); } #guide .say li.r-consequence i.dot { background: var(--cons); }
  #guide .nodelbl { display: block; margin: 2px 0 0 18px; font-size: 13px; color: var(--ink-2); } #guide .nodelbl b { color: var(--ink); }
  #guide .why { margin-top: 10px; }
  #whyBtn { font: inherit; font-size: 14px; padding: 6px 12px; border: 2px solid var(--err); border-radius: 7px; background: var(--err-bg); color: var(--err); font-weight: 700; cursor: pointer; }
  #whyBtn:hover { background: var(--err); color: #fff; }
  #guide .done { margin-top: 10px; font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 6px; }
  #guide .prog { font-size: 12px; color: var(--ink-3); margin-left: auto; }
  #engineDetails { margin-top: 4px; } #engineDetails > summary { font-size: 13px; color: var(--ink-3); cursor: pointer; padding: 2px 0; }
  #detailBody { margin-top: 6px; }
  /* callout: UI guidance, dark slate box, thin leader ending in a hollow circle (never an arrowhead: arrowheads mean data) */
  #callout { position: fixed; z-index: 60; max-width: 300px; background: var(--guide); color: var(--guide-ink); padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; box-shadow: 0 4px 14px rgba(0,0,0,.25); pointer-events: none; }
  #callout.hide { display: none; }
  #callout .k { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #cbd5e1; margin-bottom: 2px; }
  #callout .spill { pointer-events: none; }
  #calloutSvg { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 59; pointer-events: none; }
  #calloutSvg path { fill: none; stroke: var(--guide); stroke-width: 1.8; }
  #calloutSvg circle { fill: #fff; stroke: var(--guide); stroke-width: 2; }
  .t.guide-target { box-shadow: inset 0 0 0 2px var(--guide), 0 0 0 3px rgba(30,41,59,.25); animation: tpulse 2.4s ease-in-out infinite; }
  .t.role-error.guide-target { box-shadow: inset 0 0 0 2px var(--err), 0 0 0 3px rgba(30,41,59,.35); }
  @keyframes tpulse { 0%, 100% { outline: 0 solid rgba(30,41,59,0); } 50% { outline: 4px solid rgba(30,41,59,.18); } }

}

function lifecycleAt(n, tm) {
  const h = HIST[n.id] || [];
  let closed = false, committed = false;
  for (const [st, k] of h) { if (st > tm) break; if (k === 'kill') closed = true; else if (k === 'revive') closed = false; else if (k === 'commit') committed = true; }

  else if (!h.some(x => x[1] === 'commit') && n.confirmed_at != null && n.confirmed_at <= tm) committed = true;
  return closed ? 'closed' : committed ? 'committed' : 'open';
}

    e.querySelector('.tag').innerHTML = rs.map(r => `<span class="role ${r}">${r}</span>`).join(' ');
  }
  const first = n.created_at ?? (n.touches[0] || {}).step; if (first != null && tEl[first]) { const e = tEl[first]; e.classList.add('sel'); tp.scrollTop += e.getBoundingClientRect().top - tp.getBoundingClientRect().top - 80; }
  { const ts = Object.keys(roles).map(x => +x).sort((a, b) => a - b); $('#tMode').textContent = ts.length ? `thoughts that touched ${id}: ${ts.map(x => '#' + x).join(', ')}; the rest are dimmed` : `no thought touched ${id}`; }
  // card
  const own = new Set(n.own_cells);
  const kindWord = T === 'zebra' ? (n.kind === 'root' ? 'root' : (n.is_case ? 'hypothesis (opened by a branch or assumption)' : 'derived result'))
    : T === 'g24' ? (n.kind === 'root' ? 'root: the puzzle' : n.kind === 'goal' ? 'goal (a value wanted)' : n.kind === 'achieved' ? 'goal, achieved' : 'executed computation') + (n.edge_words ? ` · ${n.edge_words.includes(n.parent) ? n.edge_words : n.edge_words + ' ' + n.parent}` : '')
    : (n.kind_words || n.kind);
  const st = n.lifecycle === 'committed' ? 'commit' : n.lifecycle.startsWith('closed') ? 'dead' : n.lifecycle === 'contradictory' ? 'conf' : '';
  const statusTxt = statusSentence(n);
  const touchHtml = n.touches.length ? n.touches.map(t => `<span class="touch" data-step="${t.step}"><b>#${t.step}</b><span class="role ${t.role}">${t.role}</span></span>`).join('') : '<span class="muted small">none recorded</span>';
  const linTxt = lineage(id).slice(1).map(x => `<span class="pill link" data-node="${x}">${x}</span>`).join('');
  openDetail(`
    <h3>${id} <span class="muted" style="font-weight:400">${kindWord}</span><span class="close" title="back to the whole tree (Esc)">✕</span></h3>
    <div class="card">
      <div class="sec">holds</div>
      <div>${n.kind === 'root' ? '<span class="muted">nothing yet</span>' : segHtml(n.label)}</div>
      ${n.own_cells.length ? `<div class="small muted" style="margin-top:3px">${n.own_cells.map(c => `<span class="pill">${esc(c)}</span>`).join('')}</div>` : ''}
      ${(n.made_of || []).length ? `<div class="small muted" style="margin-top:3px">combines ${n.made_of.map(x => `<span class="pill link" data-node="${x}">${x}</span>`).join(' and ')}</div>` : ''}
      <div class="sec">status</div>
      <div class="status-line ${st}">${statusTxt}</div>
      ${T === 'zebra' ? `<div class="sec">board at this node <span class="muted" style="text-transform:none">(bold = set here, plain = inherited)</span></div>${gridTable(n.grid, {own, compare: false})}
      <label class="small muted"><input type="checkbox" id="cmpSol"> compare with the puzzle's unique solution</label> <span class="small muted" id="cmpNote"></span>`
      : T === 'g24' ? `<div class="sec">state at this node</div>${g24StateHtml(n.state, {})}`
      : `<div class="sec">world state at this node</div>${pbStateHtml(n.state, {})}`}
      ${n.about ? `<div class="small muted" style="margin-top:3px">a fact the model checks for the step <span class="pill link" data-node="${n.about}">${n.about}</span>, read at that step's pre-state; not a step of the plan</div>` : ''}
      ${n.taken_at != null && n.kind !== 'assume' && n.kind !== 'confirm' ? `<div class="small muted" style="margin-top:3px">proposed at #${n.created_at}, taken at <span class="pill link" data-step="${n.taken_at}">#${n.taken_at}</span></div>` : (n.provisional ? `<div class="small muted" style="margin-top:3px">proposed, never taken</div>` : '')}
      ${(n.relations || []).length ? `<div class="sec">relations</div><div>${n.relations.map(r => `<span class="pill">${esc(r)}</span>`).join('')}</div>` : ''}
      <div class="sec">thoughts that touched it</div>
      <div>${touchHtml}</div>
      <div class="sec">lineage from the root</div>
      <div>${linTxt || '<span class="muted small">root</span>'}</div>
      ${(n.floating || []).length ? `<details><summary>${n.floating.length} floating fact${n.floating.length > 1 ? 's' : ''} (not yet placed in a house)</summary>${n.floating.map(f => `<span class="pill">${esc(Object.entries(f).map(([k, v]) => k + '=' + v).join(', '))}</span>`).join('')}</details>` : ''}
      ${(n.rules || []).length ? `<details><summary>${n.rules.length} rule${n.rules.length > 1 ? 's' : ''} in force</summary>${n.rules.map(r => `<span class="pill">${esc(r)}</span>`).join('')}</details>` : ''}
      ${(n.verified || []).length ? `<details><summary>${n.verified.length} check${n.verified.length > 1 ? 's' : ''} recorded on this node</summary>${n.verified.map(r => `<span class="pill">${esc(r)}</span>`).join('')}</details>` : ''}
    </div>`);
  di.querySelector('.close').onclick = reset;
  di.querySelectorAll('.touch').forEach(e => e.onclick = () => selectStep(+e.dataset.step, {keepNode: id}));
  di.querySelectorAll('.pill.link').forEach(e => e.onclick = () => selectNode(e.dataset.node));
  drawMarginArrow(); layoutLabels();
  if (di.querySelector('#cmpSol')) di.querySelector('#cmpSol').onchange = ev => {
    const tbl = di.querySelector('table.grid'); tbl.outerHTML = gridTable(n.grid, {own, compare: ev.target.checked});
    const nw = di.querySelectorAll('table.grid td.wrong').length;
    di.querySelector('#cmpNote').textContent = !ev.target.checked ? '' : nw ? `: ${nw} cell${nw > 1 ? 's' : ''} disagree${nw > 1 ? '' : 's'}, see the dotted red underline` : ': every cell here agrees with the solution';
  };
}

function selectStep(i, opts = {}) {
  const s = S[i];
  state = {kind: 'step', i};
  clearTreeMarks(); clearThoughtMarks();
  tEl[i].classList.add('sel'); scrollToStep(i);
  const node = (s.op === 'PRUNE' || s.op === 'VERIFY' || s.op === 'CONFIRM') && s.target ? s.target : (s.focus_after || s.target);
  if (node && nodeEl[node]) { markLineage(node, {dimOthers: true}); centerOn(node); }
  for (const id of [...s.created, ...s.killed, ...(s.revived || [])]) if (nodeEl[id]) { nodeEl[id].classList.remove('dim'); nodeEl[id].classList.add('hot', 'lin'); }
  // resolution sentence
  let res = '';
  const created = s.created.filter(c => N[c]);
  if (s.op === 'META') res = 'No operation: the engine leaves the tree unchanged.';
  else if (s.op === 'RESTATE') res = `Restates what <b>${node}</b> already holds; no change to the tree.`;
  else if (s.op === 'VERIFY') res = `Records a check on <b>${s.target || node}</b>.`;
  else if (s.op === 'CONFIRM') res = `Commits <b>${s.target || node}</b> as (part of) the answer.`;
  else if (s.op === 'PRUNE') {
    if (s.killed.length) res = `Prunes <b>${s.target}</b>` + (s.killed.length > 1 ? ` and the ${s.killed.length - 1} node${s.killed.length > 2 ? 's' : ''} below it` : '') + `: ${s.killed.map(k => `<span class="pill link removed" data-node="${k}">${k}</span>`).join('')}`;
    else if (s.prune_reason === 'materialized_dead_child' && created.length) res = `Prunes ${s.cells.map(c => `<span class="pill">${esc(c)}</span>`).join('')}. No open node held it, so the engine adds <span class="pill link removed" data-node="${created[0]}">${created[0]}</span> under ${N[created[0]].parent} as a closed node that records the prune.`;
    else if (s.prune_reason === 'idempotent_repeat_of_last_prune') res = `Repeats the prune of <b>${s.target}</b>, already closed: no change.`;
    else res = `Prune aimed at <b>${s.target}</b>; nothing to close.`;
  }
  else if (s.op === 'ASSUME') res = created.length ? `Opens the branch <b>${created[0]}</b> under ${N[created[0]].parent}` + (s.focus_before !== N[created[0]].parent ? `, switching from <b>${s.focus_before}</b>` : '') + '.' : `Enters the existing branch <b>${node}</b>` + (s.focus_before !== node ? `, switching from <b>${s.focus_before}</b>` : '') + '.';
  else if (s.op === 'DERIVE') res = created.length ? (created.length > 1 ? `Opens ${created.length} alternatives under <b>${N[created[0]].parent}</b>: ` + created.map(c => `<span class="pill link" data-node="${c}">${c}</span>`).join('') : `Adds <b>${created[0]}</b> under ${N[created[0]].parent}.`) : `Resolves to <b>${node}</b>, which already holds this result.`;
  if (s.focus_before !== s.focus_after && s.op !== 'ASSUME' && s.op !== 'PRUNE') res += ` Current leaf: ${s.focus_before} → <b>${s.focus_after}</b>.`;
  if (s.effect) res = esc(s.effect).replace(/\b(N\d+)\b/g, (m) => N[m] ? `<span class="pill link" data-node="${m}">${m}</span>` : m);
  // board after the step, new cells highlighted
  const fresh = new Set(s.cells);
  if (s.cells_label && s.cells_label.length) res += ` <span class="muted">In words:</span> ${segHtml(s.cells_label)}.`;
  const stNode = created.length ? created[0] : node;
  const showBoard = stNode && N[stNode] && N[stNode].kind !== 'root' && (s.op === 'DERIVE' || s.op === 'ASSUME');
  const boardHtml = !showBoard ? '' : T === 'zebra' ? `<div class="sec">board at ${node} after this thought <span class="muted" style="text-transform:none">(green = set by this thought)</span></div>${gridTable(N[node].grid, {fresh})}`
    : T === 'g24' ? `<div class="sec">state at ${stNode} after this thought</div>${g24StateHtml(N[stNode].state, {fresh: true})}`
    : `<div class="sec">world state at ${stNode} after this thought</div>${pbStateHtml(N[stNode].state, {})}`;
  // parse
  const p0 = s.payload || {};
  const parseBits = [];
  const VERB = {DERIVE: 'derives', ASSUME: 'assumes', PRUNE: 'prunes', CONFIRM: 'commits', RESTATE: 'restates', VERIFY: 'checks'};
  let p = p0;
  if (T !== 'zebra') { taskParse(s, p0, parseBits); p = {}; }
  if (T === 'zebra' && s.op === 'PRUNE') { p = p0.rejected || {}; if (p0.reason) parseBits.push(`<span class="muted small">stated reason: </span>${esc(p0.reason)}`); }
  if (T === 'zebra' && s.op === 'VERIFY') { parseBits.push(`<span class="muted small">checks: </span>` + (p0.targets || []).map(t => `<span class="pill">${esc(t)}</span>`).join('') + (p0.outcome ? ` <span class="muted small">verdict: </span><span class="pill">${esc(p0.outcome)}</span>` : '')); p = {}; }
  if (T === 'zebra' && s.op === 'RESTATE') { parseBits.push(`<span class="muted small">${p0.restated_target === 'clue_recap' ? 'recaps a clue' : p0.restated_target === 'echo' ? 'echoes the board' : 'restates'}${p0.clue ? ': ' + esc(p0.clue) : ''}</span>`); }
  if (T === 'zebra' && s.op === 'DERIVE' && p0.kind) parseBits.push(`<span class="muted small">kind: </span><span class="pill">${esc(p0.kind)}${p0.combination ? ' (combination)' : ''}${p0.serial ? ' (conditional)' : ''}</span>`);
  if (Array.isArray(p.branches) && p.branches.length) parseBits.push(`<span class="muted small">alternatives: </span>` + p.branches.map(b => (b.grid || []).map(g => { const {House, ...rest} = g; return `<span class="pill">House ${esc(House)} · ${esc(Object.entries(rest).map(([k, v]) => k + ' = ' + v).join(', '))}</span>`; }).join('')).join('<span class="muted small"> or </span>'));
  if (p.combination && p.attribute) parseBits.push(`<span class="pill">${esc(p.attribute)} of houses ${esc((p.slots || []).join(', '))} are ${esc((p.values || []).join(', '))}</span>`);
  if (Array.isArray(p.grid) && p.grid.length) parseBits.push(`<span class="muted small">${VERB[s.op] || ''}: </span>` + p.grid.map(g => { const {House, ...rest} = g; return `<span class="pill">House ${esc(House)} · ${esc(Object.entries(rest).map(([k, v]) => k + ' = ' + v).join(', '))}</span>`; }).join(''));
  if (Array.isArray(p.floating) && p.floating.length) parseBits.push('<span class="muted small">floating: </span>' + p.floating.map(f => `<span class="pill">${esc(Object.entries(f).map(([k, v]) => k + ' = ' + v).join(', '))}</span>`).join(''));
  if (Array.isArray(p.rules) && p.rules.length) parseBits.push('<span class="muted small">rules: </span>' + p.rules.map(r => `<span class="pill">${esc(typeof r === 'string' ? r : JSON.stringify(r))}</span>`).join(''));
  for (const k of Object.keys(p)) if (!['grid', 'floating', 'rules', 'kind', 'branches', 'combination', 'slots', 'attribute', 'values', 'serial', 'restated_target', 'clue', 'uncertain', 'refs'].includes(k) && p[k] && (!Array.isArray(p[k]) || p[k].length)) parseBits.push(`<span class="muted small">${esc(k)}: </span><span class="pill">${esc(typeof p[k] === 'string' ? p[k] : JSON.stringify(p[k]))}</span>`);
  const voteTxt = s.vote ? Object.entries(s.vote).map(([k, v]) => `${k} ${v}`).join(', ') : '';
  const opKind = s.kind ? ` <span class="muted small">${s.engine_op.toLowerCase()} · ${s.kind}</span>` : (s.engine_op && s.engine_op !== s.op ? ` <span class="muted small">${s.engine_op.toLowerCase()}</span>` : '');
  // rows
  const rowsHtml = !s.rows.length && i !== ST.focus ? '<span class="muted small">not shown on this page (only the ' + ST.row + ' at #' + ST.focus + ' is explained here)</span>' : s.rows.length ? s.rows.map((r, k) => `<span class="chip ${r.mode}" data-k="${k}">${r.id} ${r.name}</span>`).join('') + s.rows.map((r, k) => `
      <div class="rowdetail ${r.mode}" id="rd${k}">
        <div><b>${r.id} ${r.name}</b> <span class="muted">(${MODES[r.mode]})</span></div>
        <div class="muted">Definition: the model ${esc(r.definition)}</div>
        <div style="margin-top:4px">Here: ${esc(r.why)}.</div>
        ${r.against_node ? `<div style="margin-top:4px">Defined against <span class="pill link" data-node="${r.against_node}">${r.against_node}</span>${r.against_step != null ? ` created at <span class="pill link" data-step="${r.against_step}">#${r.against_step}</span>` : ''} <span class="muted small">(dashed arrow in the tree; outlined thought in the list)</span></div>` : ''}
      </div>`).join('') : '<span class="muted small">none</span>';
  const justHtml = s.justified.length ? s.justified.map(j => `<span class="chip ok">✓ ${esc(j.tag)}</span>`).join('') : '';
  openDetail(`
    <h3>Thought #${i} <span class="op">${s.op}</span>${opKind}<span class="close" title="back to the whole tree (Esc)">✕</span></h3>
    ${noteAt[i] ? `<div class="notes"><b>${esc(noteAt[i].kind || 'note')}:</b> ${esc(noteAt[i].text)}</div>` : ''}
    <div class="card">
      <div style="white-space:pre-wrap">${esc(s.text)}</div>
      <div class="sec">parse</div>
      <div>${parseBits.length ? parseBits.join('<br>') : '<span class="muted small">no content</span>'}${voteTxt ? `<div class="muted small" style="margin-top:3px">parser votes: ${esc(voteTxt)}</div>` : ''}</div>
      <div class="sec">effect on the tree</div>
      <div>${res}</div>
      ${boardHtml}
      <div class="sec">failure rows</div>
      <div>${rowsHtml}${justHtml}</div>
    </div>
    ${opts.keepNode ? `<div class="small muted">Opened from node ${opts.keepNode}. <span class="pill link" data-node="${opts.keepNode}">back to ${opts.keepNode}</span></div>` : ''}`);
  di.querySelector('.close').onclick = reset;
  di.querySelectorAll('.pill.link[data-node]').forEach(e => e.onclick = () => selectNode(e.dataset.node));
  di.querySelectorAll('.pill.link[data-step]').forEach(e => e.onclick = () => selectStep(+e.dataset.step));
  di.querySelectorAll('.chip[data-k]').forEach(e => e.onclick = () => showRow(i, +e.dataset.k, e));
  drawMarginArrow(); strikeFor(i); setCursor(cursorAfter(i)); layoutLabels();
}

function showRow(i, k, chipEl) {
  const s = S[i], r = s.rows[k];
  const open = chipEl.classList.contains('active');
  di.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  di.querySelectorAll('.rowdetail').forEach(c => c.classList.remove('show'));
  gA.innerHTML = ''; drawStoryArc(); for (const id of new Set([ST.nodes.error, ST.nodes.origin])) drawMadeOf(id); for (const id in nodeEl) nodeEl[id].classList.remove('against'); for (const e of tEl) if (e) e.classList.remove('src', 'rel');
  tp.classList.remove('focusmode');
  if (open) return;
  chipEl.classList.add('active'); di.querySelector('#rd' + k).classList.add('show');
  const from = s.focus_after || s.target;
  if (r.against_node && r.against_node !== from) drawArc(from, r.against_node, r.mode);
  else if (r.against_node) nodeEl[r.against_node].classList.add('against');
  if (r.against_step != null && tEl[r.against_step]) {
    tEl[r.against_step].classList.add('src', 'rel'); tEl[i].classList.add('rel'); tp.classList.add('focusmode');
    for (let q = -2; q <= 2; q++) { if (tEl[r.against_step + q]) tEl[r.against_step + q].classList.add('ctx'); if (tEl[i + q]) tEl[i + q].classList.add('ctx'); }
    scrollToStep(r.against_step);
    $('#tMode').textContent = `#${i} against #${r.against_step}`;
  }
}

// ---------- draggable dividers ----------
(function dividers() {
  const root = document.documentElement;
  let dw = 480, tw = 470;
  function bind(id, onMove) {
    const d = document.getElementById(id);
    d.addEventListener('mousedown', e => {
      e.preventDefault(); d.classList.add('active');
      const start = e.clientX, w0 = {dw, tw};
      const mv = ev => { onMove(ev.clientX - start, w0); fit(); };
      const up = () => { d.classList.remove('active'); window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
      window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
    });
  }
  bind('div1', (dx, w0) => { if (!dp.classList.contains('open')) return; dw = Math.max(300, Math.min(900, w0.dw - dx)); root.style.setProperty('--dw', dw + 'px'); });
  bind('div2', (dx, w0) => { tw = Math.max(280, Math.min(900, w0.tw - dx)); root.style.setProperty('--tw', tw + 'px'); });
})();

// ---------- v2: margin arrow (error thought -> the thought it is judged against) ----------
function drawMarginArrow() {
  const svgm = $('#marginArrow'), path = $('#marginPath'), lbl = $('#marginLabel');
  const to = ST.margin && ST.margin.to; const ef = tEl[ST.focus], eo = tEl[to];
  if (true) { svgm.style.display = 'none'; lbl.style.display = 'none'; return; }   // v3: no margin arrow (user 2026-10-31); the distance stays in the sentence and the small label
  svgm.style.height = tp.scrollHeight + 'px'; svgm.setAttribute('viewBox', `0 0 30 ${tp.scrollHeight}`);
  const yf = ef.offsetTop + ef.offsetHeight / 2, yo = eo.offsetTop + eo.offsetHeight / 2;
  path.setAttribute('d', `M14,${yf} L6,${yf} L6,${yo} L14,${yo}`);
  svgm.style.display = '';
}
// ---------- v2: landing ----------
function landing() {
  state = {kind: 'landing'};
  GUIDE.restart();
  clearTreeMarks(); clearThoughtMarks();
  markLineage(ST.nodes.error, {sel: false}); setCursor(ST.nodes.error); layoutLabels();
  tp.classList.remove('focusmode');
  scrollToStep(ST.focus); di.scrollTop = 0;
  const ids = [ST.nodes.error, ST.nodes.origin].filter(x => pos[x]);
  const w = svg.clientWidth, h = svg.clientHeight; const xs = ids.map(i => pos[i].x), ys = ids.map(i => pos[i].y);
  const bw = Math.max(...xs) - Math.min(...xs) + 320, bh = Math.max(...ys) - Math.min(...ys) + 200;
  vb.k = Math.max(0.7, Math.min(1.5, Math.min(w / bw, h / bh)));
  vb.x = w * 0.42 - (Math.max(...xs) + Math.min(...xs)) / 2 * vb.k; vb.y = h / 2 - (Math.max(...ys) + Math.min(...ys)) / 2 * vb.k; applyView();
  drawMarginArrow();
}
fit(); landing();
window.addEventListener('resize', () => { drawMarginArrow(); GUIDE.place(); });
</script>
</body>
